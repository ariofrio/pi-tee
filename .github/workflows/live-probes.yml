name: Live provider probes

# Manual, evidence-only probes from GitHub-hosted runners: public catalogs and
# Tinfoil worker reachability. No credentials, inference or saved evidence.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probes:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.21.0
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm run smoke:workers
      - run: npm run smoke:catalogs
