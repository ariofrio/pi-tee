name: Native NVIDIA candidate

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/native-nvidia.yml
      - tools/nvidia-native/**
      - scripts/build-native-nvidia.mjs
      - scripts/check-native-nvidia.ts
  pull_request:
    paths:
      - .github/workflows/native-nvidia.yml
      - tools/nvidia-native/**
      - scripts/build-native-nvidia.mjs
      - scripts/check-native-nvidia.ts

permissions:
  contents: read

jobs:
  verifier:
    name: ${{ matrix.os }} / ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: x64
          - os: ubuntu-24.04-arm
            arch: arm64
          - os: macos-15-intel
            arch: x64
          - os: macos-15
            arch: arm64
          - os: windows-2025
            arch: x64
          - os: windows-11-arm
            arch: arm64
    env:
      PI_TEE_TEST_EXPECTED_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.21.0
          architecture: ${{ matrix.arch }}
      - run: rustup toolchain install 1.90.0 --profile minimal --no-self-update
      - run: rustup default 1.90.0
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: node scripts/build-native-nvidia.mjs
      - run: node --import tsx scripts/check-native-nvidia.ts
