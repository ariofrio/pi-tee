name: Portable pinned TLS

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/pinned-tls.yml
      - tools/pinned-tls/**
      - packages/core/src/pinned-tls-helper.ts
      - packages/core/src/pinned-tls.ts
      - tests/pinned-tls-helper.test.ts
      - tests/pinned-tls.test.ts
      - tests/fixtures/pinned-tls-server.mjs
      - scripts/check-pinned-tls.ts
      - package.json
      - package-lock.json
  pull_request:
    paths:
      - .github/workflows/pinned-tls.yml
      - tools/pinned-tls/**
      - packages/core/src/pinned-tls-helper.ts
      - packages/core/src/pinned-tls.ts
      - tests/pinned-tls-helper.test.ts
      - tests/pinned-tls.test.ts
      - tests/fixtures/pinned-tls-server.mjs
      - scripts/check-pinned-tls.ts
      - package.json
      - package-lock.json

permissions:
  contents: read

jobs:
  transport:
    name: ${{ matrix.os }} / ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: x64
          - os: ubuntu-24.04-arm
            arch: arm64
          - os: macos-15-intel
            arch: x64
          - os: macos-15
            arch: arm64
          - os: windows-2025
            arch: x64
          - os: windows-11-arm
            arch: arm64
    env:
      PI_TEE_TEST_EXPECTED_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.21.0
          architecture: ${{ matrix.arch }}
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: 1.26.6
          cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.13
      - run: npm ci --ignore-scripts
      - run: npm run check:pinned-tls
      - run: npm run check:pinned-tls -- --bun
