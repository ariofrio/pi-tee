name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript:
    # Tests that need private evidence fixtures skip. The WebAssembly verifier
    # workflow rebuilds the modules and covers other platforms. Node 26 is
    # Termux's default nodejs.
    name: typescript (node ${{ matrix.node }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [24.21.0, 26.10.0]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --ignore-scripts
      - run: npm run check:docs
      - run: npm run check
      - run: npm run smoke
      - run: npm run smoke:packages
      - run: npm run check:chutes-peer

  bun:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.21.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.13
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: bun test tests/pinned-tls.test.ts tests/wasm-verifiers.test.ts tests/worker-selection.test.ts tests/near-direct-channel.test.ts tests/near-gateway.test.ts tests/near-direct-discovery.test.ts tests/tinfoil-gateway.test.ts tests/route-security.test.ts tests/chutes.test.ts tests/chutes-evidence.test.ts tests/chutes-crypto.test.ts tests/chutes-provider.test.ts tests/chutes-invoke-channel.test.ts tests/cpu-floors.test.ts tests/privatemode.test.ts
      - run: bun scripts/check-chutes-peer.ts

  go:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: tools/tinfoil-public-build
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.6
          cache: false
      - run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet -mod=readonly ./...
      - run: go test -mod=readonly ./...
